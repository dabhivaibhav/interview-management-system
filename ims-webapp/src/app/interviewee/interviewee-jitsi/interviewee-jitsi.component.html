<div class="container-fluid">
    <div *ngIf="isLoading" class="cssload-container">
        <div *ngIf="isLoading" class="cssload-container">
            <h1 class="loader-text">Wait for the host to join</h1>
            <div class="cssload-speeding-wheel"></div>
          </div>
    </div>
    <div *ngIf="!hostConfirmation" class="login-container">
        <div class="row">
          <div class="login-inner-container">
            <img class="position-absolute" src="../../../../assets/images/tatvasoft.png"/>
              <form [formGroup]="intervieweeVerificationForm" (ngSubmit)="startMeeting()">
                    <h2 class="text-center login-header mt-5">Join the meeting</h2>
                    <div class="mt-4">
                        <!-- <h2 class="login-text-gray">Join the meeting</h2> -->
                        <div class="email-form-control mb-1 ">
                          <mat-form-field class="w-100" appearance="outline" color="primary">
                            <mat-label>Email</mat-label>
                            <input
                              required
                              id="email"
                              matInput
                              formControlName="email"
                              type="email"
                              placeholder="Ex. pat@example.com"
                            />
                            <mat-error
                              *ngIf="fc.email.errors?.required"
                            >
                              Please Enter Email Address
                            </mat-error>
                            <mat-error
                              *ngIf="
                               !fc.email.errors?.required &&
                                fc.email.errors?.pattern
                              "
                            >
                              Please Enter Email Address in Valid Format
                            </mat-error>
                          </mat-form-field>
                        </div>
                        <div class="d-flex justify-content-center mt-4">
                          <button
                            type="submit"
                            mat-flat-button                         
                           class="login-btn "
                          >
                            Submit
                          </button>
                        </div>
                      </div>
                      
                </form>
                <div class="mt-3">
                    <h3 class="login-instructions">Instructions</h3>
                  <ul>
                    <li>The email entered should match with the email associated with company while registering.<br></li>
                    <li class="mt-1">The interviewee should wait until the host joins.<br></li>
                  </ul> 
                  
            </div>
            </div>
        </div>
        
    </div>
    <div class="">
      <div id="jitsi-iframe" class="jitsi-content"></div>
    </div> 
  </div>
