<form [formGroup]="interviewerForm">
  <div class="d-flex justify-content-between align-items-around">
    <h1 mat-dialog-title>Select Interviewer</h1>
    <mat-icon
      id="close-icon"
      class="crossButton"
      color="primary"
      (click)="closeDialog()"
      [mat-dialog-close]="false"
      >close</mat-icon
    >
  </div>
  <hr class="title-br p-0 mt-1" />
  <mat-dialog-content>
    <div class="row">
      <div class="col-12 interviewer-container">
        <mat-form-field class="w-100">
            <mat-label>Choose Interviewer</mat-label>
            <mat-select disableOptionCentering aria-label="interviewer" formControlName="interviewer">
                <mat-option *ngFor="let element of interviewers" [value]="element.id">{{element.firstName}}
                    {{element.lastName}} ({{element.email}})</mat-option>
            </mat-select>
            <mat-error *ngIf="fc.interviewer.errors && fc.interviewer.errors?.required">Please select
                interviewer
            </mat-error>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>
  <div mat-dialog-actions class="justify-content-center pt-2">
    <div class="d-flex h-100">
      <div class="mr-2 p-2">
        <button
          class="saveBtn"
          mat-raised-button
          color="primary"
          type="submit"
          (click)="onSubmit()"
        >
          Save
        </button>
      </div>
      <div class="p-2">
        <button class="closeBtn" mat-raised-button (click)="onCancel()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</form>
