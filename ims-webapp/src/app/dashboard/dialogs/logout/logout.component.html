<div mat-dialog-content>
    <div class="d-flex align-items-around justify-content-between">
      <div>
        <h1 mat-dialog-title class="title">Log out</h1>
      </div>
      <div>
        <mat-icon id="close-icon" color="primary" (click)="closeDialog()" type="button">close</mat-icon>
      </div>
    </div>
    <hr class="title-br p-0 m-0 pb-2" />
    <div class="m-4">
      <h3 class="modal-title fs-4" id="exampleModalLabel">Are you sure you want to logout?</h3>
    </div>
    <p></p>
  </div>
  <div class="d-flex justify-content-end">
    <button class="closeBtn mr-2" mat-raised-button [mat-dialog-close]="false"
    cdkFocusInitial>Cancel</button>
    <button type="button" mat-flat-button [mat-dialog-close]="true" class="logout-btn">Log out</button>
  </div>
